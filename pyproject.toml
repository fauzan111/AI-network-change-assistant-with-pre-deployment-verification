[project]
name = "netchange"
version = "0.1.0"
description = "AI network-change assistant with pre-deployment verification (Batfish + Containerlab)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pybatfish>=2025.7",
    "anthropic>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pillow>=10"]

[project.scripts]
netchange = "netchange.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netchange"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "batfish: needs a running Batfish container on localhost:9996",
    "lab: needs the Containerlab lab deployed",
]

[tool.ruff]
line-length = 110
src = ["src"]
