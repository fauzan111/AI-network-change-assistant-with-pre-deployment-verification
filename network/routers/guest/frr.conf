frr version 10.2.1
frr defaults traditional
hostname guest
service integrated-vtysh-config
!
interface lo
 ip ospf area 0
!
interface eth1
 description p2p:core2
 ip ospf network point-to-point
 ip ospf area 0
!
interface eth2
 description lan:guest-wifi
 ip ospf area 0
!
router ospf
 ospf router-id 10.0.0.14
 passive-interface eth2
!
line vty
!
