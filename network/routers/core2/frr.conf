frr version 10.2.1
frr defaults traditional
hostname core2
service integrated-vtysh-config
!
interface lo
 ip ospf area 0
!
interface eth1
 description p2p:core1
 ip ospf network point-to-point
 ip ospf area 0
!
interface eth2
 description p2p:hq
 ip ospf network point-to-point
 ip ospf area 0
!
interface eth3
 description p2p:branch
 ip ospf network point-to-point
 ip ospf area 0
!
interface eth4
 description p2p:dc
 ip ospf network point-to-point
 ip ospf area 0
!
interface eth5
 description p2p:guest
 ip ospf network point-to-point
 ip ospf area 0
!
router ospf
 ospf router-id 10.0.0.2
!
line vty
!
