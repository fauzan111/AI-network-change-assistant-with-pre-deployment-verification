frr version 10.2.1
frr defaults traditional
hostname branch
service integrated-vtysh-config
!
interface lo
 ip ospf area 0
!
interface eth1
 description p2p:core1
 ip ospf network point-to-point
 ip ospf area 0
!
interface eth2
 description p2p:core2
 ip ospf network point-to-point
 ip ospf area 0
!
interface eth3
 description lan:branch-users
 ip ospf area 0
!
router ospf
 ospf router-id 10.0.0.12
 passive-interface eth3
!
line vty
!
