frr version 10.2.1
frr defaults traditional
hostname hq
service integrated-vtysh-config
!
interface lo
 ip ospf area 0
!
interface eth1
 description p2p:core1
 ip ospf network point-to-point
 ip ospf area 0
!
interface eth2
 description p2p:core2
 ip ospf network point-to-point
 ip ospf area 0
!
interface eth3
 description lan:hq-users
 ip ospf area 0
!
interface eth4
 description lan:mgmt
 ip ospf area 0
!
router ospf
 ospf router-id 10.0.0.11
 passive-interface eth3
 passive-interface eth4
!
line vty
!
